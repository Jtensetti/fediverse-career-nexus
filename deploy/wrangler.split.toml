# Alternative to wrangler.toml, never deploy both on the same hostname.
# Set www.nolto.social as the primary Lovable domain before enabling this.
name = "nolto-federation-gateway"
main = "nolto-gateway.mjs"
compatibility_date = "2026-09-23"
workers_dev = false
routes = [{ pattern = "nolto.social", custom_domain = true }]

[vars]
GATEWAY_MODE = "split"
FRONTEND_ORIGIN = "https://www.nolto.social"
SUPABASE_ORIGIN = "https://anknmcmqljejabxbeohv.supabase.co"
